    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Poppins, sans-serif;
            box-sizing: border-box;
        }

        .heading {
            font-size: 24px;
            line-height: 150%;
            margin-bottom: 12px;
            margin-top: 21px;
            color: #000000;
        }

        .para {
            font-size: 16px;
            line-height: 150%;
            color: #000000;
        }

        .btn-1 {
            font-size: 16px;
            line-height: 150%;
            color: #FFFFFF;
            opacity: 1;
            border-radius: 23px;
            padding: 11px 28px;
            gap: 10px;
            background: #2C49FE;
            border: none;
            cursor: pointer;
        }

        .btn-1:hover {
            background: #FFFFFF;
            color: #2C49FE;
            border: 2px solid #2C49FE;
        }

        .img {
            border-radius: 20px;
            object-fit: cover;
        }

        .img:hover {
            border-radius: 0px;
        }

        .card-parent {
            padding: 35px 37px 30px 43px;
            max-width: 424px;
            opacity: 1;
            border-radius: 30px;
            border-width: 1px;
            background: #FFFFFF;
            border: 1px solid #00000033
        }

        .card-parent:hover {
            box-shadow: 0px 8px 35px 0px #0000001A;
            border: none;
        }

        .heading-1 {
            font-size: 48px;
            line-height: 100%;
            margin-bottom: 33px;
            color: #000000;
        }

        @media (max-width:992px) {
            .main-parent {
                padding: 20px 0;
            }

            .heading-1 {
                font-size: 35px;
                margin-top: 20px 16px;
            }

            .card-parent {
                padding: 20px;
            }
        }
    </style>
</head>
